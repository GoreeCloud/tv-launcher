name: Android TV emulator smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'qa-fixture/**'
      - 'settings.gradle'
      - '.github/scripts/tv-interaction-smoke.py'
      - '.github/scripts/tests/**'
      - '.github/workflows/tv-smoke.yml'
      - '.github/scripts/tv-smoke.sh'
      - 'gradle/**'
      - 'build.gradle'
      - 'app/build.gradle'

permissions:
  contents: read

jobs:
  tv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test read-only APK update preflight safety
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Test isolated UI-fixture parser and safety guards
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Build debug APK and isolated local TV app fixtures
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :qa-fixture:assembleDebug
      - name: Verify packaged TV branding and privacy
        run: python3 .github/scripts/verify-asset-pin.py && python3 .github/scripts/verify-package-privacy.py
      - name: Install Google TV emulator
        run: |
          set -euo pipefail
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          AVDMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/avdmanager' | sort -V | tail -1)
          test -x "$SDKMGR" && test -x "$AVDMGR"
          "$SDKMGR" --sdk_root="$ANDROID_HOME" 'emulator' 'platform-tools' 'system-images;android-34;google-tv;x86'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMGR" create avd --name GoreeCloudTvTest --package 'system-images;android-34;google-tv;x86' --path "$ANDROID_AVD_HOME/GoreeCloudTvTest.avd" --force
          echo "AVD directory: $ANDROID_AVD_HOME"
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -name 'config.ini' -o -name '*.ini' | head -12
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/GoreeCloudTvTest.ini"
          CONFIG="$ANDROID_AVD_HOME/GoreeCloudTvTest.avd/config.ini"
          test -f "$CONFIG"
          sed -i -e '/^hw.lcd.width=/d' -e '/^hw.lcd.height=/d' -e '/^hw.lcd.density=/d' "$CONFIG"
          printf "hw.lcd.width=1920\nhw.lcd.height=1080\nhw.lcd.density=240\n" >> "$CONFIG"
      - name: Boot emulator and smoke-test app
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p tv-qa
          if test -e /dev/kvm; then sudo chown "$(id -u)" /dev/kvm; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd GoreeCloudTvTest -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > tv-qa/emulator.log 2>&1 &
          bash .github/scripts/tv-smoke.sh
      - name: Upload isolated emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoreeCloud-TV-emulator-QA
          path: tv-qa/
          if-no-files-found: warn
          retention-days: 7
