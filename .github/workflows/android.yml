name: Android TV debug validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Ubuntu GitHub runners already provide the Android SDK command-line tools.
      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -n "$SDKMGR"
          "$SDKMGR" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: GoreeCloud-TV-Launcher-debug-unverified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
