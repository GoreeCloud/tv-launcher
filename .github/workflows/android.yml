name: Android TV debug validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # Ubuntu GitHub runners already provide the Android SDK command-line tools.
      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -n "$SDKMGR"
          "$SDKMGR" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check original TV graphic integrity
        run: python3 .github/scripts/verify-asset-pin.py
      - name: Test read-only APK update preflight safety
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Test and build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Verify packaged TV branding and least-privilege permissions
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: python3 .github/scripts/verify-package-privacy.py
      - name: Upload development APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GoreeCloud-TV-Launcher-debug-unverified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
