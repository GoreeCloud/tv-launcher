plugins {
    id 'com.android.application'
}
android {
    namespace 'com.goreecloud.tvlauncher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.goreecloud.tvlauncher'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.2.0-alpha.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
